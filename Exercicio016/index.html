<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 016</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container">
        <h1 class="text-center">Acréscimo e desconto</h1>
        <div class="row">
            <div class="col">
                <form class="mx-auto p-5 w-50" id="formulario">
                    <label class="form-label mt-4">Valor da Conta:</label>
                    <input class="form-control" id="valorConta">
                    <label class="form-labl">Valor %:</label>
                    <input class="form-control"  id="percentual">
                </form>
            </div>       
        </div>
        <div class="col">            
            <form class=" border mx-auto p-3 w-50" >
                <label class="text-center form-label">Função</label>
                     <div class="col">                    
                      <br>
                      <SPAN class= "border fs-3 p-2" ID="operacao"> op.escolhida</SPAN>
                      <button class="btn btn-success w-100 mt-4" id="acre" type="button" onclick="fnAcrescimo()">ACRÉSCIMO</button>
                      <button class="btn btn-danger w-100 mt-4" id="desc" type="button" onclick="fnDesconto()">DESCONTO</button>
                     </div>
            </form>    
        </div>
        <div class="container mt-2">
                <div class="col">            
                <form class=" border mx-auto p-3 w-50" >
                    <button class="btn btn-primary w-100 mt-4 mb-4" id="calcular" type="button" onclick="fnCalcular()">CALCULAR</button>
                    <label class="mb-1">Valor à pagar</label><br>
                    <span class="mb-4 fs-2 fw-semibold" id="pagar"></span> 
                </div>
         </div>
    </div>
    <script src="app.js"></script>
</body>    
</html>
